services:
  # 1. The Redis Message Broker (Free Tier)
  - type: redis
    name: netguard-redis
    ipAllowList: [] 
    plan: free

  # 2. The Monolith API + Worker (Free Tier)
  - type: web
    name: netguard-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh 
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: netguard-redis
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
